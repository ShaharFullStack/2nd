name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  play:
    name: play the game in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The demo stems are generated, not committed as binaries in every checkout depth;
      # regenerate if the checkout is missing them so the audio harnesses have a song.
      - name: Ensure demo stems exist
        run: test -f public/songs/demo-groove/stems/drums.wav || npm run gen-demo-stems
      - run: npx playwright install --with-deps chromium
      - name: Play a session end to end
        run: npm run critic:smoke
      - name: Prove the player's stem follows the patient
        run: npm run critic:audio
      - name: Capture gameplay frames
        run: npm run critic:frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-frames
          path: |
            critic/frames/
            critic/screenshots/
            critic/motion/
          if-no-files-found: ignore
